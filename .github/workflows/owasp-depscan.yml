name: "OWASP dep-scan"

on:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install dep-scan
      run: pipx install owasp-depscan

    - name: dep-scan-full
      run: ~/.local/bin/depscan --bom lam/sbom.json

    - name: dep-scan
      run: ~/.local/bin/depscan --bom lam/sbom.json 2>&1 | grep "No oss vulnerabilities detected"
