name: "Quality"

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.2'
        extensions: ldap, xdebug, gd, json, xml, curl, zip, mbstring, imagick, pdo_sqlite

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-quality-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-quality-

    - name: PHP Version
      run: php --version

    - name: Install dependencies
      run: composer install --no-progress

    - name: Install CodeSpell
      run: pipx install codespell

    - name: CodeSpell
      run: ./codespell.sh

    - name: PHPStan Version
      run: ./vendor/bin/phpstan -V

    - name: PHPStan
      run: ./vendor/bin/phpstan

    - name: Rector
      run: ./vendor/bin/rector process --dry-run
