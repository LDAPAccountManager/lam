<h2>1. File name</h2>
The CSS files are saved in <span style="font-weight: bold;">style/</span>.
Your file must be named <span style="font-weight: bold;">700_&lt;your
unique name&gt;.css</span>.<br>
<br>
<span style="font-weight: bold;">Example:</span> style/700_example.css
<br>
<h2>2. Contents</h2>
See 100_lam-responsive.css for existing variables (e.g. colors). They can be reused in your CSS.
